appId: local.qr.etiketka
productName: QR Duplicator
directories:
  app: desktop
  output: release
files:
  - '*.cjs'
  - phone.html
  - splash.html
  - package.json
  - app/**/*
asar: true
extraResources:
  - from: desktop/app-update.yml
    to: app-update.yml
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  signAndEditExecutable: true
  signExecutable: false
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: QR-Duplicator-Setup-${version}-x64.exe
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  deleteAppDataOnUninstall: false
portable:
  artifactName: QR-Duplicator-Portable-${version}-x64.exe
  requestExecutionLevel: user
publish:
  provider: github
  owner: trytocry
  repo: Doodka-scan
  releaseType: draft
